name: 週次 厚生労働省 疑義解釈チェック

on:
  schedule:
    # 毎週月曜 09:00 JST (= 00:00 UTC)
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run MHLW update check
        run: python src/check_mhlw_updates.py

      - name: Commit report if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/weekly_report.md data/processed/mhlw_watch_state.json || true
          if git diff --cached --quiet; then
            echo "変更なし — コミットをスキップします"
          else
            git commit -m "data: 週次 厚生労働省更新チェック $(date +'%Y-%m-%d')"
            git push
          fi
